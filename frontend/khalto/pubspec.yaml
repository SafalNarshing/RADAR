name: khalto
description: "RADAR — Road Assessment & Damage Accountability Reporter"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.0
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  permission_handler: ^11.4.0
  geocoding: ^5.0.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  camera: ^0.11.0+2
  http: ^1.2.0
  flutter_tts: ^4.2.5
  onnxruntime: ^1.4.1
  image: ^4.9.1
  provider: ^6.1.2
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/models/
